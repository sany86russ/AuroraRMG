name: Build & Release

# Собирает single-file .exe на раннерах GitHub, генерирует подписанный
# build-provenance attestation и публикует .exe как ассет GitHub Release.
#
# Триггеры:
#   * push тега вида vX.Y.Z   — основной путь релиза (запушьте тег → выйдет релиз)
#   * workflow_dispatch       — ручной запуск с указанием тега
#
# Проверка происхождения бинарника пользователем:
#   gh attestation verify AuroraRMG.exe --repo sany86russ/AuroraRMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для сборки и публикации (например v0.8.2)'
        required: true
        type: string

permissions:
  contents: write       # создавать релизы и загружать ассеты
  id-token: write       # OIDC-токен для подписи attestation
  attestations: write   # запись build-provenance attestation

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    env:
      SLN: "Olden Era - Template Editor.slnx"
      APP_CSPROJ: "Olden Era - Template Editor/Olden Era - Template Editor.csproj"
      # Имя ассета ДОЛЖНО быть ровно AuroraRMG.exe — его ищет UpdateService автообновления.
      ASSET: "AuroraRMG.exe"

    steps:
      - name: Resolve tag & version
        id: ver
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="$REQUESTED_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег должен быть в формате vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Снимаем ведущую 'v': v0.8.2 -> 0.8.2
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "Релиз $TAG (версия сборки $VERSION)"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.ver.outputs.tag }}

      - name: Verify source revision
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$COMMIT" != "$TAG_COMMIT" ]; then
            echo "::error::Исходники не соответствуют тегу релиза"
            exit 1
          fi
          if [ "$TRIGGER_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$TRIGGER_SHA" != "$COMMIT" ]; then
            echo "::error::Запускайте workflow из самого тега релиза: происхождение бинарника должно соответствовать исходникам"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$env:SLN"

      - name: Build (Release)
        run: dotnet build "$env:SLN" -c Release --no-restore

      - name: Test (gate — не релизим сломанное)
        run: dotnet test "$env:SLN" -c Release --no-build --verbosity normal

      - name: Publish single-file exe
        shell: bash
        run: |
          dotnet publish "$APP_CSPROJ" \
            -c Release -r win-x64 --self-contained true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0 \
            -p:FileVersion=${{ steps.ver.outputs.version }}.0 \
            -o publish
          # AssemblyName=OldenEraTemplateGenerator -> переименовываем в требуемое имя ассета
          mv "publish/OldenEraTemplateGenerator.exe" "$ASSET"
          ls -l "$ASSET"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Publish release with verified asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $asset = Get-Item -LiteralPath $env:ASSET
          if ($asset.VersionInfo.FileVersion -ne "$($env:RELEASE_VERSION).0") {
            throw "The executable version does not match $tag."
          }
          $digest = 'sha256:' + (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash

          function Read-Release {
            $PSNativeCommandUseErrorActionPreference = $false
            $response = gh release view $tag --repo $repo --json isDraft,assets 2>$null
            if ($LASTEXITCODE -eq 0) { $response | ConvertFrom-Json }
          }
          function Invoke-GitHub {
            gh @args
            if ($LASTEXITCODE -ne 0) { throw "GitHub CLI failed (exit $LASTEXITCODE)." }
          }
          function Find-Asset($release) {
            $release.assets | Where-Object name -eq $asset.Name
          }
          function Assert-Asset($release) {
            $uploaded = @(Find-Asset $release)
            if ($uploaded.Count -ne 1 -or $uploaded[0].state -ne 'uploaded' -or
                $uploaded[0].size -ne $asset.Length -or $uploaded[0].digest -ne $digest) {
              throw "The release asset differs from the verified build. Existing assets were left intact."
            }
          }

          $release = Read-Release
          if ($release -and !$release.isDraft) {
            Assert-Asset $release
            Write-Output "Published $tag already contains the verified asset."
            exit 0
          }
          if (!$release) {
            $notes = "docs/release-notes-$tag.md"
            $noteArgs = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
            Invoke-GitHub release create $tag --repo $repo --verify-tag --draft --target $env:RELEASE_COMMIT --title "AuroraRMG $tag" @noteArgs
            $release = Read-Release
          }
          if (!$release -or !$release.isDraft) { throw "Could not verify the draft for $tag." }

          # A failed GitHub upload can leave an empty starter asset that blocks a retry.
          $existing = @(Find-Asset $release)
          if ($existing.Count -eq 1 -and $existing[0].state -ceq 'starter' -and $existing[0].size -eq 0) {
            $assetUrl = '^https://api\.github\.com/repos/' + [regex]::Escape($repo) + '/releases/assets/([1-9][0-9]*)$'
            if ($existing[0].apiUrl -notmatch $assetUrl) { throw "Could not verify the incomplete asset in $tag." }
            Invoke-GitHub api --method DELETE "repos/$repo/releases/assets/$($Matches[1])"
            $release = Read-Release
            if (!$release -or !$release.isDraft) { throw "Could not verify the draft after removing the incomplete asset for $tag." }
          }
          if (!(Find-Asset $release)) {
            Invoke-GitHub release upload $tag $asset.FullName --repo $repo
            $release = Read-Release
          }
          if (!$release -or !$release.isDraft) { throw "Could not verify the uploaded draft for $tag." }
          Assert-Asset $release
          Invoke-GitHub release edit $tag --repo $repo --draft=false --latest
